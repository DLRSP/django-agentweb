[build-system]
requires = [
  "setuptools >= 77",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "django-agentweb"
description = "Make Django sites first-class citizens of the agentic web: llms.txt, Schema.org/JSON-LD, agent discovery, WebMCP tools, agentic commerce/booking and SDF — per-site opt-in."
authors = [
    { name = "DLRSP", email = "dlrsp.dev@gmail.com" },
]
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "django",
    "llms-txt",
    "ai-agents",
    "schema-org",
    "json-ld",
    "webmcp",
    "mcp",
    "agentic-commerce",
    "agent-ready-web",
    "structured-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django :: 5.2",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Django>=3.2",
]

[project.urls]
Homepage = "https://github.com/DLRSP/django-agentweb"
Documentation = "https://dlrsp.github.io/django-agentweb/"
Repository = "https://github.com/DLRSP/django-agentweb"
Issues = "https://github.com/DLRSP/django-agentweb/issues"
Changelog = "https://github.com/DLRSP/django-agentweb/blob/main/CHANGELOG.rst"
Funding = "https://github.com/sponsors/DLRSP"

[project.optional-dependencies]
# Feature extras — each agent-web domain that needs more than stdlib/Django.
# Pure-Django domains (llms, jsonld, discovery core, sdf) need no extra.
webmcp = [
    # Server-side proxy to booking/commerce vendors (avoids exposing creds to
    # the agent's browser). See AGENTWEB["WEBMCP"]["DATA_SOURCE"].
    "requests>=2.28",
]
webbotauth = [
    # Web Bot Auth — HTTP Message Signatures (RFC 9421) verification.
    "cryptography>=42",
]
commerce = [
    "requests>=2.28",
]
all = [
    "requests>=2.28",
    "cryptography>=42",
]
testing = [
    "coverage",
    "codecov",
    "pytest",
    "pytest-django",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-git-revision-date-plugin>=2.0",
]
linting = [
    "flake8",
    "flake8-pyproject",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-tidy-imports",
    "flake8-typing-imports",
    "pylint",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "agentweb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: the share/django-agentweb/requirements wheel data-files block and CI
# assert-wheel-locks=true are added once the per-env pip-compile locks
# (requirements/py*-django*.txt) are generated by the upgrade-dependency workflow.

[tool.distutils.bdist_wheel]
universal = false

[tool.black]
line-length = 80
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.check-manifest]
ignore = [
    "AGENTS.md",
]

# Read by flake8 when flake8-pyproject is installed (extra `linting`).
[tool.flake8]
max-line-length = 80
select = ["E", "F", "W", "B", "B950", "C", "I", "TYP"]
ignore = ["E203", "E501", "W503", "B950"]
per-file-ignores = [
    "**/migrations/*:B950",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest.ini_options]
addopts = """\
    --strict-config
    --strict-markers
    --ds=tests.settings
    """
django_find_project = false
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.run]
branch = true
source = ["agentweb"]

[tool.coverage.report]
show_missing = true

[tool.towncrier]
package = "agentweb"
package_dir = "src"
filename = "CHANGELOG.rst"
directory = "news/"
version = "0.0.1"
issue_format = "`#{issue} <https://github.com/DLRSP/django-agentweb/issues/{issue}>`_"
type = [
  { name = "Process",                   directory = "process", showcontent = true },
  { name = "Deprecations and Removals", directory = "removal", showcontent = true },
  { name = "Features",                  directory = "feature", showcontent = true },
  { name = "Bug Fixes",                 directory = "bugfix",  showcontent = true },
  { name = "Vendored Libraries",        directory = "vendor",  showcontent = true },
  { name = "Improved Documentation",    directory = "doc",     showcontent = true },
  { name = "Trivial Changes",           directory = "trivial", showcontent = false },
]

# bump-my-version
[tool.bumpversion]
current_version = "0.0.1"
commit = true
tag = true
allow_dirty = true

[[tool.bumpversion.files]]
filename = "./src/agentweb/__init__.py"
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'
